<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>markitzero</title>
  <style>
    @font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 400; font-display: swap;
      src: url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-style: italic; font-weight: 400; font-display: swap;
      src: url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 700; font-display: swap;
      src: url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-style: italic; font-weight: 700; font-display: swap;
      src: url(fonts/atkinson-hyperlegible-latin-700-italic.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 400; font-display: swap;
      src: url(fonts/atkinson-hyperlegible-latin-ext-400-normal.woff2) format('woff2'); unicode-range: U+0100-02AF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: 'Atkinson Hyperlegible'; font-style: normal; font-weight: 700; font-display: swap;
      src: url(fonts/atkinson-hyperlegible-latin-ext-700-normal.woff2) format('woff2'); unicode-range: U+0100-02AF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

    :root {
      --bg: #ffffff;
      --text: #1D1621;      /* Tiltshift-aubergine: hoog contrast, minder hard dan zwart */
      --muted: #5a5260;
      --accent: #E64544;    /* Tiltshift-rood */
      --rule: #e8e4ea;
      --code-bg: #f5f3f6;
      --mark: #ffe9a8;
      --heading: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      font-size: 20px;
      line-height: 1.5;
      word-spacing: 0.04em;
      text-rendering: optimizeLegibility;
    }
    @media (min-width: 640px) { body { font-size: 22px; } }

    /* Dunne navigatiebalk */
    .topnav { border-bottom: 1px solid var(--rule); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .topnav div { max-width: 760px; margin: 0 auto; padding: 0.55rem 20px; color: var(--muted); }
    .topnav a { color: var(--text); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--accent); }
    .topnav a:hover { color: var(--accent); }

    main { max-width: 760px; margin: 0 auto; padding: 2.5rem 20px 2rem; overflow-wrap: break-word; }
    @media (min-width: 768px) { main { padding-top: 5rem; } }

    h1, h2, h3, h4, h5, h6 { font-family: var(--heading); font-weight: 700; line-height: 1.2; margin: 2.2rem 0 0.75rem; }
    h1 { font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1.05; margin: 0 0 1.5rem; text-wrap: balance; }
    h2 { font-size: 1.2rem; margin-top: 2.6rem; }
    h3 { font-size: 1rem; }
    h4, h5, h6 { font-size: 0.9rem; }

    p { margin: 0 0 1.5rem; }
    ul, ol { margin: 0 0 2rem; padding-left: 1.3em; }
    li { margin-bottom: 0.4rem; }
    li > ul, li > ol { margin: 0.4rem 0 0; }
    li::marker { color: var(--accent); }
    strong { font-weight: 700; }

    a { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 0.18em; text-decoration-thickness: 2px; }
    a:hover { color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

    blockquote { margin: 0 0 2rem; padding: 0.1rem 0 0.1rem 1rem; border-left: 4px solid var(--accent); }
    blockquote > :last-child { margin-bottom: 0; }
    hr { border: 0; border-top: 2px solid var(--rule); margin: 2.5rem 0; }
    mark { background: var(--mark); padding: 0 0.15em; }

    code, pre { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.8em; }
    code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
    pre { background: var(--code-bg); padding: 1em 1.2em; margin: 0 0 1.5rem; border-radius: 6px; overflow-x: auto; line-height: 1.45; }
    pre code { background: none; padding: 0; font-size: 1em; }

    table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; margin: 0 0 1.5rem; font-size: 0.85em; }
    th, td { border-bottom: 1px solid var(--rule); padding: 0.5em 0.8em 0.5em 0; text-align: left; vertical-align: top; }
    th { font-family: var(--heading); border-bottom: 2px solid var(--text); }

    img { max-width: 100%; height: auto; }
    input[type=checkbox] { width: 1em; height: 1em; vertical-align: -0.1em; margin-right: 0.4em; accent-color: var(--accent); }
    li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.3em; }

    .status { color: var(--muted); }
    .error { color: #b3261e; font-weight: 700; }
    .paste { width: 100%; min-height: 240px; padding: 0.8em; font: 0.7rem/1.5 ui-monospace, monospace; border: 2px solid var(--rule); border-radius: 6px; background: #fff; color: inherit; }

    footer { max-width: 760px; margin: 0 auto 90px; padding: 2rem 20px 0; text-align: center; font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted); }
    footer a { color: var(--text); font-weight: 700; }

    @media print { .topnav, footer { display: none; } }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Andere microtools"><div>Andere microtools door Johan Groenen: <a href="https://www.algoritmeregister.org/schemas/">Schemas</a></div></nav>
  <main><article id="content"><p class="status">Laden…</p></article></main>
  <footer>MARKITZERO · A MICROTOOL BY <a href="https://www.tiltshift.nl/mensen/johan-groenen">Johan Groenen, Tiltshift</a><span id="source"></span></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    (async function () {
      const el = document.getElementById('content');

      const message = (msg, isError) => {
        el.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'status' + (isError ? ' error' : '');
        p.textContent = msg;
        el.appendChild(p);
      };

      const render = (text, base) => {
        el.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true }));
        if (base) {
          // Relatieve links en afbeeldingen oplossen t.o.v. het markdown-bestand
          el.querySelectorAll('img[src]').forEach((img) => {
            img.src = new URL(img.getAttribute('src'), base).href;
          });
          el.querySelectorAll('a[href]').forEach((a) => {
            const href = a.getAttribute('href');
            if (href.startsWith('#')) return;
            const abs = new URL(href, base);
            // Links naar andere markdown-bestanden ook via deze viewer openen
            a.href = /\.(md|markdown)$/i.test(abs.pathname) && /^https?:$/.test(abs.protocol)
              ? '?url=' + encodeURIComponent(abs.href)
              : abs.href;
          });
        }
        const h1 = el.querySelector('h1');
        const name = h1 ? h1.textContent : base ? base.pathname.split('/').pop() : '';
        document.title = name ? `${name} · markitzero` : 'markitzero';
      };

      // Terugval: markdown plakken of een bestand erin slepen
      const showFallback = (msg, base) => {
        message(msg, true);
        if (base) {
          const p = document.createElement('p');
          p.className = 'status';
          p.append('Open het bestand, kopieer de inhoud en plak die hieronder: ');
          const a = document.createElement('a');
          a.href = base.href; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = base.href;
          p.append(a);
          el.appendChild(p);
        }
        const ta = document.createElement('textarea');
        ta.className = 'paste';
        ta.placeholder = 'Plak hier markdown, of sleep een .md-bestand op deze pagina…';
        ta.addEventListener('input', () => ta.value.trim() && render(ta.value, base));
        el.appendChild(ta);
        ta.focus();
      };

      document.addEventListener('dragover', (e) => e.preventDefault());
      document.addEventListener('drop', async (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) render(await file.text(), null);
      });

      const param = new URLSearchParams(location.search).get('url');
      if (!param) return showFallback('Geen ?url= opgegeven. Gebruik ?url=https://…/bestand.md', null);

      let src;
      try { src = new URL(param, location.href); } catch { return showFallback('Ongeldige URL: ' + param, null); }
      if (!/^https?:$/.test(src.protocol)) return showFallback('Alleen http(s)-URL\'s worden ondersteund.', null);

      // GitHub "blob"-links omzetten naar raw-links
      const gh = src.hostname === 'github.com' && src.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
      if (gh) src = new URL(`https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/${gh[3]}`);

      const srcLink = document.createElement('a');
      srcLink.href = src.href;
      srcLink.textContent = 'bron';
      document.getElementById('source').append(' · ', srcLink);

      const fetchText = async (url, ms, headers = {}) => {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        try {
          const res = await fetch(url, { signal: ctrl.signal, headers });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.text();
        } finally {
          clearTimeout(timer);
        }
      };

      // Eerst rechtstreeks; bij CORS-blokkade via r.jina.ai (geeft de inhoud ongewijzigd terug)
      const routes = [
        ['direct', src.href, 10000, {}],
        ['jina', 'https://r.jina.ai/' + src.href, 20000, { 'X-Return-Format': 'text' }],
      ];

      let text;
      const errors = [];
      for (const [name, url, ms, headers] of routes) {
        if (name !== 'direct') message(`Rechtstreeks laden lukt niet, nu via ${name}…`);
        try {
          text = await fetchText(url, ms, headers);
          if (name !== 'direct') document.getElementById('source').append(` (via ${name})`);
          break;
        } catch (e) {
          errors.push(`${name}: ${e.name === 'AbortError' ? 'timeout' : e instanceof TypeError ? 'geblokkeerd' : e.message}`);
        }
      }
      if (text === undefined) {
        return showFallback(`Kon het bestand niet laden (${errors.join('; ')}).`, src);
      }
      render(text, src);
    })();
  </script>
</body>
</html>
